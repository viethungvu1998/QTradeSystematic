version: 1
run_tag: ml_factor_classifier_v1
strategy: ml_factor
algorithm: ml_factor_classifier
description: >
  VN100 ML factor classifier autoresearch. The fixed command target is
  notebooks/ml_factor_classifier.py via a thin trial wrapper that writes
  per-trial YAML configs and metrics.json.

quota:
  max_trials: 220

objective:
  metric: sharpe
  direction: maximize
  min_delta: 0.0

criteria:
  mode: all
  targets:
    - metric: sharpe
      op: ">="
      value: 1.7
    - metric: max_drawdown
      op: "<="
      value: 0.25

paths:
  artifact_root: configs/strategies/ml_factor/autoresearch/v1_ledger
  run_root: configs/strategies/ml_factor/autoresearch/v1_runs
  allowed_edit_roots:
    - configs/strategies/ml_factor/
    - notebooks/ml_factor_classifier.py

command:
  argv:
    - .venv/bin/python
    - configs/strategies/ml_factor/autoresearch/run_classifier_trial.py
    - --config=configs/strategies/ml_factor/autoresearch/v1_runs/ml_factor_classifier_v1/098_threshold45_scores_top3_quantiles5575_xgb10_max3/trial_config.yaml
    - --output-dir={run_dir}
    - --run-name={run_id}
    - --data-csv=data/VNSTOCK.csv
    - --skip-tearsheet
    - --rank-col=class_3_4_prob
    - --probability-threshold=0.45
    - --clear-min-predicted-class
    - --forward-period=12
    - --classification-window=120
    - --fallback-min-positions=3
    - --max-positions=4
    - --rebalance-frequency=8
    - --stop-loss=0.05
    - --disable-benchmark-regime
    - --class-quantiles=0.15,0.35,0.55,0.70
    - --class-scores=-2,-1,0,1,3
    - --xgb-n-estimators=10
    - --xgb-max-depth=3

research_limits:
  allowed_actions:
    - id: tune_hyperparams
      aliases:
        - change_rebalance_period
        - change_signal_threshold
        - change_classification_bins
    - id: change_portfolio_params
    - id: stop_take_profit_rule
      aliases:
        - sl_tp
        - stop_loss_take_profit

next_step_policy:
  diagnostics:
    bad_max_drawdown_above: 0.25
    bad_win_rate_below: 0.5
  first_experiments:
    - id: rank_score_max_positions_6
      idea_family: change_portfolio_params
      change: run rank_col=score with max_positions=6
    - id: rank_score_rebalance_5
      idea_family: tune_hyperparams
      change: run rank_col=score with rebalance_frequency=5
    - id: rank_score_rebalance_10
      idea_family: tune_hyperparams
      change: run rank_col=score with rebalance_frequency=10
    - id: rank_score_forward_10
      idea_family: tune_hyperparams
      change: run rank_col=score with forward_period=10
    - id: rank_score_xgb_20_depth3
      idea_family: tune_hyperparams
      change: run rank_col=score with xgb n_estimators=20 max_depth=3
    - id: rank_score_quantiles_tail
      idea_family: tune_hyperparams
      change: run rank_col=score with tail classification quantiles
    - id: sl_tp_overlay
      idea_family: stop_take_profit_rule
      change: add and test stop-loss/take-profit overlay in the backtest module
