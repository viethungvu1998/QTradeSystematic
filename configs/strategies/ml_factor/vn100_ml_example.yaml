workflow: research
asset_types: [vn_stock]

universe: vn100

start_date: "2018-01-01"
end_date: "2025-12-31"
test_start_date: "2023-01-01"
initial_capital: 100000000

data_sources:
  vn_stock: vnstock
storage: duckdb
features:
  indicators:
    - name: rsi
      params: {periods: [14, 21]}
    - name: roc
      params: {periods: [14, 21]}
    - name: ma
      params: {periods: [5, 10, 20]}

strategy:
  type: ml_factor
  params:
    task: classification
    cv_splits: 5
    cv_gap: 12
    cv_test_size: 12

rebalance_frequency: 12
portfolio_construction:
  name: equal_weight
  params:
    num_long_positions: [5, 8, 10]
    num_short_positions: 0

backtest_engine: vectorbt
train_window: 252  # 252 * 3

commission:
  model: percentage
  rate: 0.0015

benchmark: "VN:VNINDEX"
